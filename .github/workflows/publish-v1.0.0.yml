name: Publish v1.0.0

on:
  push:
    paths:
      - ".github/workflows/publish-v1.0.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD^)"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

          mkdir -p dist
          git archive --format=zip "$TARGET_SHA"             theme.yaml settings.yaml templates i18n LICENSE README.md CHANGELOG.md             -o dist/halo-theme-still-1.0.0.zip

          unzip -l dist/halo-theme-still-1.0.0.zip | head -40

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Still for Halo v1.0.0

          First public release of **Still for Halo**, a clean and minimal theme for Halo focused on typography and reading experience.

          ### Highlights

          - Minimal responsive homepage and article layout
          - Larger first article card on the homepage
          - Optional site avatar
          - Halo primary menu support
          - Dark mode toggle
          - Search Widget integration when available
          - Article cover support
          - Clean Markdown typography
          - Full-width Markdown tables
          - Dark code blocks with syntax highlighting support
          - Archives, categories, tags, authors, pages, and posts
          - Halo comments
          - Chinese and English UI strings

          ### Requirements

          - Halo >= 2.24.0

          ### Installation

          Download **halo-theme-still-1.0.0.zip**, then upload it in Halo Console under **Themes → Theme Management → Install**.

          The public release contains no personal avatar, demo cover, site title, or other personal preset content.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists."
            exit 0
          fi

          gh release create v1.0.0             dist/halo-theme-still-1.0.0.zip             --repo "${{ github.repository }}"             --target "$TARGET_SHA"             --title "Still for Halo v1.0.0"             --notes-file release-notes.md
