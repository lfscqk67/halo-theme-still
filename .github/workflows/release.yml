name: Release Theme

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable theme ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -r "dist/halo-theme-still-${VERSION}.zip" . \
            -x ".git/*" \
               ".github/*" \
               "dist/*" \
               "*.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
