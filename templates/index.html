<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = null, content = ~{::content})}"
>
<th:block th:fragment="content">
  <section class="post-list" th:if="${not #lists.isEmpty(posts.items)}">
    <th:block th:each="post,stat : ${posts.items}">
      <article th:replace="~{modules/post-card :: card(post=${post},index=${stat.index},home=${true})}"></article>
    </th:block>
  </section>

  <div class="empty" th:if="${#lists.isEmpty(posts.items)}" th:text="#{empty.posts}">还没有文章。</div>

  <nav class="pagination" th:if="${posts.hasPrevious() || posts.hasNext()}">
    <a th:if="${posts.hasPrevious()}" th:href="@{${posts.prevUrl}}">← <span th:text="#{pagination.previous}">上一页</span></a>
    <span th:unless="${posts.hasPrevious()}"></span>
    <a th:if="${posts.hasNext()}" th:href="@{${posts.nextUrl}}"><span th:text="#{pagination.next}">下一页</span> →</a>
  </nav>
</th:block>
</html>
