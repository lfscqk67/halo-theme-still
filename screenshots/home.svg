<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="cover1" x1="0" x2="1">
      <stop offset="0" stop-color="#e9eef3"/>
      <stop offset="1" stop-color="#d8dee7"/>
    </linearGradient>
    <linearGradient id="cover2" x1="0" x2="1">
      <stop offset="0" stop-color="#edf1f5"/>
      <stop offset="1" stop-color="#e3e8ed"/>
    </linearGradient>
    <linearGradient id="cover3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dce8f3"/>
      <stop offset="1" stop-color="#c5d3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-opacity=".10"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .site-title { font-size: 30px; font-weight: 700; fill: #171a1f; }
      .subtitle { font-size: 16px; fill: #8a94a3; }
      .nav { font-size: 16px; font-weight: 600; fill: #6f7886; }
      .meta { font-size: 14px; fill: #96a0ad; }
      .post-title-lg { font-size: 27px; font-weight: 700; fill: #171a1f; }
      .post-title { font-size: 21px; font-weight: 700; fill: #171a1f; }
      .excerpt { font-size: 16px; fill: #75808f; }
      .more { font-size: 15px; font-weight: 600; fill: #4f7fbf; }
      .footer { font-size: 13px; fill: #9aa3af; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="42" y="34" rx="18" width="1516" height="900" fill="#fff"/>
  </g>

  <!-- browser bar -->
  <path d="M60 34h1480a18 18 0 0 1 18 18v52H42V52a18 18 0 0 1 18-18z" fill="#f7f9fb"/>
  <circle cx="78" cy="69" r="8" fill="#ff605c"/>
  <circle cx="104" cy="69" r="8" fill="#ffbd44"/>
  <circle cx="130" cy="69" r="8" fill="#00ca4e"/>
  <rect x="180" y="51" width="1080" height="36" rx="18" fill="#fff" stroke="#e3e8ee"/>
  <circle cx="210" cy="69" r="6" fill="none" stroke="#87919f" stroke-width="2"/>
  <path d="M214 73l8 8" stroke="#87919f" stroke-width="2" stroke-linecap="round"/>
  <text x="242" y="75" class="sans subtitle">https://example.com</text>

  <!-- site header -->
  <g transform="translate(168 142)">
    <text x="0" y="30" class="sans site-title">My Notes</text>
    <text x="0" y="58" class="sans subtitle">Thoughts, code, and everyday things.</text>

    <text x="918" y="30" class="sans nav" fill="#171a1f">Home</text>
    <rect x="918" y="44" width="43" height="2" fill="#4f7fbf"/>
    <text x="1002" y="30" class="sans nav">Archive</text>
    <text x="1099" y="30" class="sans nav">About</text>

    <circle cx="1202" cy="23" r="9" fill="none" stroke="#171a1f" stroke-width="2.5"/>
    <path d="M1208 30l8 8" stroke="#171a1f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1262 13a14 14 0 1 0 13 19 12 12 0 0 1-13-19z" fill="#171a1f"/>
  </g>

  <!-- first post -->
  <g transform="translate(168 258)">
    <rect x="0" y="0" width="445" height="260" rx="9" fill="url(#cover1)"/>
    <rect x="92" y="46" width="260" height="160" rx="14" fill="#eef1f4"/>
    <text x="118" y="82" class="sans" font-size="28" font-weight="600" fill="#65717f">Homelab</text>
    <text x="118" y="112" class="sans" font-size="14" fill="#8a94a3">Small Home.</text>
    <text x="118" y="134" class="sans" font-size="14" fill="#8a94a3">Big Possibilities.</text>
    <rect x="205" y="145" width="135" height="68" rx="8" fill="#252b31"/>
    <rect x="220" y="160" width="11" height="8" rx="2" fill="#111418"/>
    <rect x="240" y="160" width="14" height="8" rx="2" fill="#5f95c2"/>
    <rect x="261" y="160" width="14" height="8" rx="2" fill="#5f95c2"/>
    <rect x="284" y="160" width="18" height="8" rx="2" fill="#111418"/>
    <rect x="310" y="160" width="18" height="8" rx="2" fill="#111418"/>

    <!-- metadata: pill and date aligned on one baseline with comfortable spacing -->
    <rect x="490" y="4" width="60" height="24" rx="12" fill="#eef5ff"/>
    <text x="505" y="21" class="sans" font-size="12" fill="#7fa1c6">Pinned</text>
    <text x="570" y="21" class="sans meta">2026-09-19  ·  Homelab</text>

    <text x="490" y="79" class="sans post-title-lg">Building a Small Homelab with Proxmox</text>
    <text x="490" y="119" class="sans excerpt">A practical look at a compact home server setup,</text>
    <text x="490" y="147" class="sans excerpt">virtualization, networking, and self-hosted services.</text>
    <text x="490" y="198" class="sans more">Continue Reading  →</text>
  </g>

  <line x1="168" y1="550" x2="1432" y2="550" stroke="#e9edf2"/>

  <!-- second post -->
  <g transform="translate(168 582)">
    <rect x="0" y="0" width="260" height="140" rx="8" fill="url(#cover2)"/>

    <!-- simple laptop + cup illustration, no tiny clipped text -->
    <rect x="44" y="35" width="116" height="68" rx="6" fill="#fff" stroke="#d7dde4"/>
    <rect x="55" y="46" width="94" height="47" rx="3" fill="#dbe3ea"/>
    <path d="M34 106h136l-10 10H44z" fill="#cbd4dd"/>
    <rect x="182" y="50" width="42" height="50" rx="9" fill="#fff" stroke="#d7dde4"/>
    <path d="M223 61c20 0 20 28 0 28" fill="none" stroke="#d7dde4" stroke-width="6"/>

    <text x="302" y="22" class="sans meta">2026-08-30  ·  Notes</text>
    <text x="302" y="61" class="sans post-title">Notes on Self-Hosting</text>
    <text x="302" y="92" class="sans excerpt">Small lessons from running services at home.</text>
    <text x="302" y="126" class="sans more">Continue Reading  →</text>
  </g>

  <line x1="168" y1="752" x2="1432" y2="752" stroke="#e9edf2"/>

  <!-- third post -->
  <g transform="translate(168 785)">
    <rect x="0" y="0" width="260" height="112" rx="8" fill="url(#cover3)"/>
    <path d="M0 92 L58 53 L105 83 L154 46 L208 82 L260 57 L260 112 L0 112 Z" fill="#9fb6c9" opacity=".75"/>
    <path d="M0 106 L65 81 L121 102 L181 75 L260 95 L260 112 L0 112 Z" fill="#7f9bb2" opacity=".75"/>

    <text x="302" y="20" class="sans meta">2026-08-12  ·  Journal</text>
    <text x="302" y="58" class="sans post-title">Hello, Still</text>
    <text x="302" y="88" class="sans excerpt">A quiet, minimal Halo theme for writing and reading.</text>
  </g>

  <!-- footer -->
  <line x1="168" y1="912" x2="1432" y2="912" stroke="#e9edf2"/>
  <text x="168" y="932" class="sans footer">© 2026 My Notes · Powered by Halo · Still</text>
  <text x="1280" y="932" class="sans footer">GitHub   RSS</text>
</svg>