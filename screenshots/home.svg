    <rect x="261" y="160" width="14" height="8" rx="2" fill="#5f95c2"/>
    <rect x="284" y="160" width="18" height="8" rx="2" fill="#111418"/>
    <rect x="310" y="160" width="18" height="8" rx="2" fill="#111418"/>

    <text x="490" y="28" class="sans meta">2026-09-19  ·  Homelab</text>
    <rect x="490" y="0" width="52" height="24" rx="12" fill="#eef5ff"/>
    <text x="503" y="17" class="sans" font-size="12" fill="#7fa1c6">Pinned</text>
    <text x="490" y="79" class="sans posttitle">Building a Small Homelab with Proxmox</text>
    <text x="490" y="119" class="sans excerpt">A practical look at a compact home server setup,</text>
    <text x="490" y="147" class="sans excerpt">virtualization, networking, and self-hosted services.</text>
