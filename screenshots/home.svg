      .nav { font-size: 16px; font-weight: 600; fill: #6f7886; }
      .meta { font-size: 14px; fill: #96a0ad; }
      .posttitle { font-size: 27px; font-weight: 700; fill: #171a1f; }
      .posttitle2 { font-size: 21px; font-weight: 700; fill: #171a1f; }
      .excerpt { font-size: 16px; fill: #75808f; }
      .more { font-size: 15px; font-weight: 600; fill: #4f7fbf; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="42" y="34" rx="18" width="1516" height="850" fill="#ffffff"/>
