  <g transform="translate(168 578)">
    <rect x="0" y="0" width="260" height="140" rx="8" fill="url(#cover2)"/>
    <rect x="92" y="25" width="82" height="92" rx="10" fill="#ffffff" stroke="#d7dde4"/>
    <path d="M174 49c28 0 28 44 0 44" fill="none" stroke="#d7dde4" stroke-width="8"/>
    <text x="107" y="59" class="sans" font-size="12" font-weight="700" fill="#30363d">Good</text>
    <text x="107" y="76" class="sans" font-size="12" font-weight="700" fill="#30363d">Ideas</text>
    <text x="107" y="93" class="sans" font-size="12" font-weight="700" fill="#30363d">Better Days</text>

    <text x="302" y="22" class="sans meta">2026-08-30  ·  Notes</text>
    <text x="302" y="61" class="sans posttitle2">Notes on Self-Hosting</text>
