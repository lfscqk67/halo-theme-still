    <text x="0" y="62" class="sans subtitle">Thoughts, code, and everyday things.</text>

    <text x="920" y="34" class="sans nav" fill="#171a1f">Home</text>
    <rect x="920" y="48" width="43" height="2" fill="#4f7fbf"/>
    <text x="1000" y="34" class="sans nav">Archive</text>
    <text x="1095" y="34" class="sans nav">About</text>

    <circle cx="1198" cy="27" r="9" fill="none" stroke="#171a1f" stroke-width="2.5"/>
