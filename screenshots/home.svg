  <g transform="translate(168 776)">
    <rect x="0" y="0" width="260" height="80" rx="8" fill="url(#cover3)"/>
    <path d="M0 70 L58 31 L105 61 L154 24 L208 60 L260 35 L260 80 L0 80 Z" fill="#9fb6c9" opacity=".75"/>
    <path d="M0 78 L65 53 L121 74 L181 47 L260 67 L260 80 L0 80 Z" fill="#7f9bb2" opacity=".75"/>

    <text x="302" y="18" class="sans meta">2026-08-12  ·  Journal</text>
    <text x="302" y="54" class="sans posttitle2">Hello, Still</text>
